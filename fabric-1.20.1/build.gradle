plugins {
    id 'dev.architectury.loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-fabric-1.20.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_1_20 as int
}

def java17Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java17Launcher
}

loom {
    silentMojangMappingsLicense()
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://mvn.devos.one/snapshots" } // Create Fabric
    maven { url = "https://mvn.devos.one/releases" } // Porting Lib
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.tterrag.com/" } // Flywheel (legacy)
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
    maven {
        url = "https://jitpack.io/"
        content { includeGroupAndSubgroups("com.github") }
    }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:${fabric_loader_version_1_20}")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_20}"
    mappings loom.layered {
        officialMojangMappings { nameSyntheticMembers = false }
        parchment("org.parchmentmc.data:parchment-${minecraft_version_1_20}:${parchment_version_1_20}@zip")
    }

    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version_1_20}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_20}")

    implementation project(':common')

    // Create Fabric 6 — Porting Lib / Flywheel / Ponder come transitively
    modImplementation("com.simibubi.create:create-fabric:${create_fabric_version_1_20}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-fabric:0.4.1")
    modImplementation("io.github.llamalad7:mixinextras-fabric:0.4.1")
}

processResources {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_license            : mod_license,
            minecraft_version      : minecraft_version_1_20,
            fabric_loader_version  : fabric_loader_version_1_20,
            fabric_api_version     : fabric_api_version_1_20,
            create_version         : create_fabric_version_1_20,
            create_version_range   : create_fabric_version_range_1_20
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
