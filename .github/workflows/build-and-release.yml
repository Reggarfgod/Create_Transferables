name: Build and Release

on:
  push:
    branches:
      - main
      - Multi-dev
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read mod version from gradle.properties
        id: mod_info
        run: |
          VERSION=$(grep -E "^mod_version\s*=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find 'mod_version' in gradle.properties"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted mod version: ${VERSION}"

      - name: Check if release tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.mod_info.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist. Proceeding with build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 21 & 17
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Setup Gradle
        if: steps.check_tag.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: steps.check_tag.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Build mod with Gradle
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          # Strip local developer java path if present
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          ./gradlew build --no-daemon

      - name: Collect 4 Subproject Artifacts
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p release_artifacts

          # Target the 4 subprojects directly
          TARGET_DIRS=("common" "fabric-1.20.1" "forge-1.20.1" "neoforge-1.21.1")

          for dir in "${TARGET_DIRS[@]}"; do
            if [ -d "$dir/build/libs" ]; then
              for jar in "$dir"/build/libs/*.jar; do
                if [ -f "$jar" ]; then
                  filename=$(basename "$jar")
                  # Skip sources, javadoc, or dev artifacts
                  if [[ "$filename" == *"-sources"* ]] || [[ "$filename" == *"-javadoc"* ]] || [[ "$filename" == *"-dev"* ]]; then
                    continue
                  fi
                  cp "$jar" "release_artifacts/${filename}"
                  echo "Collected: $jar -> release_artifacts/${filename}"
                fi
              done
            else
              echo "Directory $dir/build/libs not found, skipping."
            fi
          done

          echo "=== Staged files for release ==="
          ls -lh release_artifacts/

      - name: Generate Changelog
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## What's Changed" > CHANGELOG.md
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" >> CHANGELOG.md
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

      - name: Create Git Tag and GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mod_info.outputs.tag }}
          name: Release ${{ steps.mod_info.outputs.version }}
          body_path: CHANGELOG.md
          files: release_artifacts/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
