name: Crowdin Action

on:
  push:
    branches:
      - Multi-Ver
    paths:
      - 'common/src/main/resources/assets/transferables/lang/en_us.json'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_Multi-Ver
          create_pull_request: true
          pull_request_title: 'l10n: New Crowdin Translations'
          pull_request_body: 'Automated pull request with updated translations from Crowdin.'
          commit_message: 'l10n: Update translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
