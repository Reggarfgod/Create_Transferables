plugins {
    id 'dev.architectury.loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-forge-1.20.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_1_20 as int
}

def java17Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java17Launcher
}

loom {
    forge {
        mixinConfig "transferables.mixins.json"
    }
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://modmaven.dev" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_20}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${minecraft_version_1_20}-${forge_version_1_20}"

    implementation project(':common')

    // Create 6.0 Forge 1.20.1
    modImplementation("com.simibubi.create:create-${minecraft_version_1_20}:${create_version_1_20}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version_1_20}:${ponder_version_1_20}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version_1_20}:${flywheel_version_1_20}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version_1_20}:${flywheel_version_1_20}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version_1_20}")

    // MixinExtras for Forge 1.20.1 & Create
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    modImplementation("io.github.llamalad7:mixinextras-forge:0.4.1")
}

processResources {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_license            : mod_license,
            minecraft_version_range: minecraft_version_range_1_20,
            forge_version_range    : forge_version_range_1_20,
            loader_version_range   : loader_version_range_1_20,
            create_version_range   : create_version_range_1_20
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
